name: iOS TestFlight – Ringtools Dev (handmatige signing, via tag)

# EXPLICIET DOOR DE EIGENAAR GESTART; nooit automatisch. DEV-variant "Ringtools Dev" (bundle-ID nl.ringapeldoorn.ringtools.dev, backend
# https://dev.ringapeldoorn.nl; naast de productieapp installeerbaar). De productieconfiguratie in Git blijft ongewijzigd: de variant
# (mobile/variants/dev.json) wordt alleen in de werkkopie op de runner toegepast.
#
# SIGNING: uitsluitend HANDMATIG met een bestaand Apple Distribution-certificaat (.p12) en een App Store-profiel voor het dev-bundle-ID, uit
# beschermde environment-secrets. Er is GEEN automatische provisioning en de App Store Connect-sleutel wordt niet voor signing gebruikt, zodat er
# nooit nieuwe Apple Development-certificaten worden aangemaakt (de oorzaak van "maximum number of certificates"). Zie docs/IOS-DEV-TESTFLIGHT.md.
#
# Starten (alleen een commit die op de branch develop staat wordt geaccepteerd):
#   git tag ios-dev-check-<versie>-<build>   → alleen controleren of P12 + profiel importeerbaar en geldig zijn (geen build)
#   git tag ios-dev-build-<versie>-<build>   → ondertekende Release-archive + IPA + controles; GEEN upload (IPA als artifact, 3 dagen)
#   git tag ios-dev-upload-<versie>-<build>  → idem en daarna upload naar TestFlight (pas na jouw afzonderlijke akkoord)
# Voorbeeld: ios-dev-build-1.0.0-1. Handmatig starten via Actions kan ook, maar pas zodra dit bestand op de standaardbranch main staat.
on:
  push:
    tags:
      - "ios-dev-check-*"
      - "ios-dev-build-*"
      - "ios-dev-upload-*"
  workflow_dispatch:
    inputs:
      mode:
        description: check (alleen importcontrole) | build (archive+IPA, geen upload) | upload (ook TestFlight-upload; alleen na akkoord)
        type: choice
        options: [check, build, upload]
        default: build
      marketing_version:
        description: Versie voor gebruikers (CFBundleShortVersionString), bijv. 1.0.0
        type: string
        default: "1.0.0"
      build_number:
        description: Oplopend buildnummer (verplicht voor build/upload)
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: ios-testflight-dev
  cancel-in-progress: false

jobs:
  testflight:
    name: "Dev: controleren, ondertekenen en (alleen na akkoord) uploaden"
    runs-on: macos-latest
    environment: testflight
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      IOS_BUNDLE_ID: nl.ringapeldoorn.ringtools.dev
      IOS_LINK_HOST: dev.ringapeldoorn.nl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Modus, versie en buildnummer bepalen
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_VERSION: ${{ inputs.marketing_version }}
          INPUT_BUILD: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            [[ "$GITHUB_REF_NAME" =~ ^ios-dev-(check|build|upload)-([0-9]+\.[0-9]+(\.[0-9]+)?)-([0-9]+)$ ]] || { echo "::error::Tag moet ios-dev-<check|build|upload>-<versie>-<build> zijn, bijv. ios-dev-build-1.0.0-1."; exit 1; }
            MODE="${BASH_REMATCH[1]}"; VERSION="${BASH_REMATCH[2]}"; BUILD="${BASH_REMATCH[4]}"
          else
            MODE="$INPUT_MODE"; VERSION="$INPUT_VERSION"; BUILD="$INPUT_BUILD"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Ongeldige versie."; exit 1; }
            [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::Ongeldig buildnummer."; exit 1; }
          fi
          {
            echo "RT_MODE=$MODE"
            echo "MARKETING_VERSION=$VERSION"
            echo "BUILD_NUMBER=$BUILD"
          } >> "$GITHUB_ENV"
      - name: Alleen een commit op de branch develop accepteren
        working-directory: .
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop
          git merge-base --is-ancestor "$GITHUB_SHA" origin/develop || { echo "::error::Deze commit staat niet op develop; een dev-build wordt alleen van develop gemaakt."; exit 1; }
      - name: Benodigde secrets aanwezig? (alleen namen worden gecontroleerd)
        working-directory: .
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_DEV_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_DEV_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          need="IOS_TEAM_ID IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_DEV_PROVISIONING_PROFILE_BASE64"
          [ "$RT_MODE" = upload ] && need="$need ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8_BASE64"
          for v in $need; do
            [ -n "${!v}" ] || { echo "::error::Secret $v ontbreekt in de omgeving 'testflight' (zie docs/IOS-DEV-TESTFLIGHT.md)."; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: python3 -m pip install -r scripts/signing-requirements.txt
      - name: Signing- en bundletests (synthetische sleutels; geen echte middelen)
        run: |
          python3 -m unittest discover -s scripts -p 'test_ios_signing.py'
          python3 scripts/test_verify_ios_bundle.py
      - run: npm ci
      - run: npm test
      - run: npm run check:native-config # valideert eerst de (ongewijzigde) productieconfiguratie
      - name: Dev-variant met handmatige signing toepassen (alleen in deze werkkopie)
        run: |
          node scripts/configure-variant.mjs dev --manual-signing
          node scripts/configure-variant.mjs dev --print-env >> "$GITHUB_ENV"
      - name: Webclient bouwen en synchroniseren (VITE_API_URL=https://dev.ringapeldoorn.nl uit de variant)
        if: ${{ env.RT_MODE != 'check' }}
        run: |
          npm run build
          npx cap sync ios
      - name: Distribution-certificaat en dev-profiel controleren en tijdelijk importeren
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_DEV_PROVISIONING_PROFILE_BASE64 }}
          IOS_IMPORT_AUTHORIZED: "true"
          IOS_SIGNING_AUTHORIZED: "true"
        run: |
          if [ "$RT_MODE" = check ]; then
            python3 scripts/ios_distribution.py import-check
          else
            python3 scripts/ios_distribution.py prepare --no-attestation
          fi
      - name: Ondertekende Release-archive en IPA-export met volledige distributiecontroles
        if: ${{ env.RT_MODE != 'check' }}
        env:
          IOS_SIGNING_AUTHORIZED: "true"
        run: python3 scripts/ios_distribution.py build
      - name: TestFlight-upload (alleen modus upload, na afzonderlijk akkoord van de eigenaar)
        if: ${{ env.RT_MODE == 'upload' }}
        env:
          IOS_UPLOAD_AUTHORIZED: "true"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: python3 scripts/ios_distribution.py upload
      - name: Tijdelijke middelen en eerdere keychain/profielen herstellen (ook bij fouten)
        if: always()
        run: python3 scripts/ios_distribution.py cleanup
