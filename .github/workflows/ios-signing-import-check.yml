name: iOS signing importcontrole (geen build of upload)
on:
  workflow_dispatch:
    inputs:
      import_authorized:
        description: Eigenaar heeft uitsluitend deze tijdelijke P12-importcontrole afzonderlijk goedgekeurd
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ringtools-ios-signing
  cancel-in-progress: false
jobs:
  import-check:
    if: ${{ github.repository == 'rjgout/Ringtools' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    environment: testflight
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      IOS_IMPORT_AUTHORIZED: ${{ inputs.import_authorized }}
    steps:
      - uses: actions/checkout@v4
      - name: Afzonderlijke eigenaarstoestemming controleren
        working-directory: .
        run: |
          [ "$IOS_IMPORT_AUTHORIZED" = true ] || { echo '::error::Importcontrole is geblokkeerd zonder afzonderlijke eigenaarstoestemming.'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/signing-requirements.txt
      - name: Alleen middelen valideren en in tijdelijke keychain importeren
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: python3 scripts/ios_distribution.py import-check
      - name: Tijdelijke middelen opruimen en eerdere toestand herstellen
        if: always()
        run: python3 scripts/ios_distribution.py cleanup
      - name: Alleen niet-geheim importbewijs bewaren na succesvolle controle en opruiming
        uses: actions/upload-artifact@v4
        with:
          name: ringtools-import-check-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ringtools-import-report/import-check.json
          if-no-files-found: error
          retention-days: 7
