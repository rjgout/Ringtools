name: iOS TestFlight (handmatig)

# No automatic provisioning. Owner approval is separate from the import-only check.
on:
  workflow_dispatch:
    inputs:
      signing_authorized:
        description: Eigenaar heeft deze echte Distribution-build afzonderlijk goedgekeurd
        type: boolean
        default: false
      import_check_run_id:
        description: Geslaagde afzonderlijk goedgekeurde importcontrole op dezelfde main-commit
        type: string
        required: true
      api_url:
        description: HTTPS-backend
        type: string
        default: https://ringapeldoorn.nl
      marketing_version:
        description: CFBundleShortVersionString
        type: string
        default: '1.0.0'
      build_number:
        description: Oplopend buildnummer (leeg = workflow-runnummer)
        type: string
        default: ''
      upload:
        description: Eigenaar heeft ook de TestFlight-upload expliciet goedgekeurd
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
concurrency:
  group: ringtools-ios-signing
  cancel-in-progress: false
jobs:
  testflight:
    if: ${{ github.repository == 'rjgout/Ringtools' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    environment: testflight
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      VITE_API_URL: ${{ inputs.api_url }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number != '' && inputs.build_number || github.run_number }}
      IOS_SIGNING_AUTHORIZED: ${{ inputs.signing_authorized }}
    steps:
      - uses: actions/checkout@v4
      - name: Afzonderlijke toestemming en publieke invoer controleren
        working-directory: .
        run: |
          set -euo pipefail
          [ "$IOS_SIGNING_AUTHORIZED" = true ] || { echo '::error::Echte signing is geblokkeerd zonder afzonderlijke eigenaarstoestemming.'; exit 1; }
          [[ "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || exit 1
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          [[ "$VITE_API_URL" =~ ^https:// ]] || exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: python3 -m pip install -r scripts/signing-requirements.txt
      - run: python3 -m unittest discover -s scripts -p 'test_*signing*.py'
      - run: python3 scripts/test_verify_ios_bundle.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:native-config
      - run: npx cap sync ios
      - name: Bestaande Distribution-middelen controleren en tijdelijk importeren
        env:
          GH_TOKEN: ${{ github.token }}
          IMPORT_CHECK_RUN_ID: ${{ inputs.import_check_run_id }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: python3 scripts/ios_distribution.py prepare --import-run-id "$IMPORT_CHECK_RUN_ID"
      - name: Handmatige Distribution-archive en IPA-export met volledige distributiecontroles
        run: python3 scripts/ios_distribution.py build
      - name: Expliciet goedgekeurde TestFlight-upload
        if: ${{ inputs.upload }}
        env:
          IOS_UPLOAD_AUTHORIZED: ${{ inputs.upload }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: python3 scripts/ios_distribution.py upload
      - name: Tijdelijke middelen en eerdere keychain/profielen herstellen (ook bij fouten)
        if: always()
        run: python3 scripts/ios_distribution.py cleanup
