permissions:
  contents: read

jobs:
  backend:
    name: Mobiele backend (API, push, links, sessies)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ringtools_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ringtools_ci?schema=public
      SETTINGS_ENCRYPTION_KEY: ci-test-encryptie-sleutel-niet-voor-productie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx prisma migrate deploy
      - name: Backend-tests die de mobiele apps raken
        run: >-
          npx vitest run tests/reviewRecovery.test.ts tests/reviewReadiness.test.ts tests/notificationPrivacy.test.ts tests/workflowLifecycleApi.test.ts tests/awaitingRelease.test.ts
          tests/api.test.ts tests/nativePush.test.ts tests/wellknown.test.ts tests/push.test.ts
          tests/sessions.test.ts tests/openlinks.test.ts tests/mfa.test.ts tests/mfaProof.test.ts
          tests/rings.test.ts tests/hardening.test.ts tests/notifications.test.ts
          tests/proposals.test.ts tests/ontheffingen.test.ts tests/release.test.ts tests/catalog.test.ts
          tests/ringsetup.test.ts tests/management.test.ts tests/workflow.test.ts tests/churchfunctions.test.ts
          tests/invitations.test.ts tests/nativeMfa.test.ts tests/mailer.test.ts
          tests/simpleLogin.test.ts tests/nativeTotpLogin.test.ts tests/webTotp.test.ts
          tests/trustedDevices.test.ts tests/deviceLogin.test.ts tests/deviceLoginConcurrency.test.ts
          tests/deviceEnrollment.test.ts tests/deviceAuthorization.test.ts
          tests/webCookieAuth.test.ts tests/webAppRedirect.test.ts

  client:
    name: Client en native configuratie
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Splash-assets controleren (huisstijl, geen oude placeholders)
        run: npm run check:splash
      - run: npm test
      - run: npm run build
      - name: Webomgeving bouwen (web/PWA, dezelfde client)
        run: npm run build:web
      - name: Tests van de iOS-bundlecontrole (signing, get-task-allow, APNs)
        run: python3 scripts/test_verify_ios_bundle.py
      - name: Native configuratie controleren (identiteit, links, privacy, geen geheimen)
        run: npm run check:native-config
      - name: Capacitor-configuratie controleren
        run: npx cap doctor || true

  android:
    name: Android debug-build (zonder signing)
    runs-on: ubuntu-latest
    needs: [client, backend]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # De runner heeft de Android SDK al (ANDROID_HOME); Gradle haalt ontbrekende onderdelen zelf op.
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Debug-APK bouwen
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ringtools-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    name: iOS simulator-build (zonder signing)
    runs-on: macos-latest
    needs: [client, backend]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Bouwen voor de simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/splash-simulator" CODE_SIGNING_ALLOWED=NO build
      - name: Launchscreen op iPhone en iPad vastleggen (licht en donker)
        timeout-minutes: 25
        run: ./scripts/capture-splash-simulators.sh "$RUNNER_TEMP/splash-simulator/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/splash-screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ringtools-ios-splash-screenshots
          path: |
            ${{ runner.temp }}/splash-screenshots/*.png
            ${{ runner.temp }}/splash-screenshots/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: iOS-configuraties controleren (productie-entitlements én Personal Team-testconfiguratie)
        run: ./scripts/verify-ios-configs.sh
      # Release-archive voor een echt toestel, zonder signing: vangt fouten die alleen in Release/device optreden vóór een TestFlight-upload.
      - name: Release-archive (device, zonder signing) en controle van de app-bundel
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ci.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
          APP="$RUNNER_TEMP/ci.xcarchive/Products/Applications/App.app"
          test -d "$APP" || { echo "::error::App.app ontbreekt in de archive."; exit 1; }
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy ontbreekt in de app-bundel (vereist door App Store Connect)."; exit 1; }
          test -f "$APP/Assets.car" || { echo "::error::Assets.car (appicoon) ontbreekt."; exit 1; }
          PB=/usr/libexec/PlistBuddy
          [ "$($PB -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "nl.ringapeldoorn.ringtools" ] || { echo "::error::Onverwachte bundle-ID."; exit 1; }
          [ "$($PB -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist")" = "false" ] || { echo "::error::ITSAppUsesNonExemptEncryption moet false zijn."; exit 1; }
          [ "$($PB -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = "18.0" ] || { echo "::error::Onverwachte MinimumOSVersion."; exit 1; }
          $PB -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist" >/dev/null || { echo "::error::CFBundleIconName ontbreekt (appicoon niet gekoppeld)."; exit 1; }
          echo "Release-archive OK: versie $($PB -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($($PB -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
