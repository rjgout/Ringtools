name: Build en publiceer Docker-image

# Bij een pull request wordt de volledige Docker-image gebouwd en doorgelicht, zonder te publiceren.
# - Push naar main (productie): tests, image bouwen en doorlichten, daarna publiceren als :latest en :sha-<kort> (ongewijzigd proces).
# - Push naar develop (ontwikkelomgeving): tests, image bouwen en doorlichten, Playwright (e2e.yml) en pas daarna publiceren als
#   :develop en :develop-<kort>. Een develop-image krijgt NOOIT de tags :latest of :sha-… en kan dus geen productie-image overschrijven.
# Er wordt nergens automatisch gedeployed: containers worden uitsluitend door de eigenaar bijgewerkt (Portainer / Watchtower).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-entrypoint.sh"
      - "package.json"
      - "package-lock.json"
      - "prisma/**"
      - "src/**"
      - "public/**"
      - "shared/**"
      - "mobile/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Naam blijft gelijk (bestaande vereiste checks); bouwt en controleert alleen. Publiceren gebeurt in de job "publish" hieronder.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ringtools_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Code uitchecken
        uses: actions/checkout@v4

      - name: Node.js opzetten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Dependencies installeren
        run: npm ci

      - name: Prisma Client genereren
        run: npx prisma generate

      - name: Typecontrole
        run: npx tsc --noEmit

      - name: Migraties toepassen op CI-database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ringtools_ci?schema=public

      - name: Tests draaien
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ringtools_ci?schema=public
          SETTINGS_ENCRYPTION_KEY: ci-test-encryptie-sleutel-niet-voor-productie

      - name: Docker Buildx opzetten
        uses: docker/setup-buildx-action@v3

      - name: Image bouwen (zonder publicatie) voor de controle
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ringtools-controle:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image doorlichten (start, gezondheid, webomgeving, geen geheimen)
        run: |
          set -euo pipefail
          docker run -d --name ringtools-controle --network host \
            -e DATABASE_URL="postgresql://postgres:postgres@localhost:5432/ringtools_ci?schema=public" \
            -e SETTINGS_ENCRYPTION_KEY="ci-test-encryptie-sleutel-niet-voor-productie" \
            -e APP_BASE_URL="http://localhost:2809" -e COOKIE_SECURE=false -e PORT=2809 \
            ringtools-controle:ci
          for i in $(seq 1 40); do
            curl -fsS http://localhost:2809/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:2809/api/health
          echo
          # API: openbaar capaciteitenoverzicht, en de beveiligde webomgeving verwijst zonder sessie naar de inlogpagina.
          curl -fsS http://localhost:2809/api/mobile/v1/meta | grep -q '"apiVersion"'
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:2809/app)" = "307 http://localhost:2809/login?next=%2Fapp"
          # Webomgeving: de gebundelde client zit in de image en wordt statisch geserveerd (zonder gegevens).
          docker exec ringtools-controle test -f public/app/index.html
          ASSET="$(docker exec ringtools-controle sh -c "grep -o '/app/assets/[^\"]*\.js' public/app/index.html | head -1")"
          test -n "$ASSET"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:2809$ASSET")" = "200"
          # Een cookie-verzoek zonder de eigen header wordt nooit als aangemeld beschouwd.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Cookie: ringtools_session=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' http://localhost:2809/api/mobile/v1/me)" = "401"
          # Geen geheimen of omgevingsbestanden in de image.
          ! docker run --rm --entrypoint sh ringtools-controle:ci -c 'ls -A /app | grep -E "^\.env"' 
          docker logs ringtools-controle 2>&1 | tail -15
          docker rm -f ringtools-controle >/dev/null

  # Playwright is voorwaarde voor het publiceren van de :develop-image. Voor main blijft het productieproces ongewijzigd
  # (e2e.yml draait daar los); een push naar main slaat deze job over.
  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  publish:
    name: Image publiceren
    needs: [build-and-push, e2e]
    # main: build-and-push moet geslaagd zijn (e2e is dan overgeslagen). develop: build-and-push én e2e moeten geslaagd zijn.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.build-and-push.result == 'success' &&
      ((github.ref == 'refs/heads/main' && needs.e2e.result == 'skipped') ||
       (github.ref == 'refs/heads/develop' && needs.e2e.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Code uitchecken
        uses: actions/checkout@v4

      - name: Inloggen bij GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx opzetten
        uses: docker/setup-buildx-action@v3

      - name: Metadata voor de image bepalen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Strikt gescheiden tags per branch: main -> latest + sha-<kort>; develop -> develop + develop-<kort>.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=develop-,format=short,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Taggcontrole (geen productietags vanaf develop)
        run: |
          set -euo pipefail
          echo "${{ steps.meta.outputs.tags }}"
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            ! echo "${{ steps.meta.outputs.tags }}" | grep -E ':(latest|sha-)' 
          fi

      - name: Image publiceren
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
