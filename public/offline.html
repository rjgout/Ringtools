<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Geen verbinding · Ringtools</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef1f8;
      color: #0f1222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0b0c14; color: #f2f3fb; }
      .card { background: rgba(24,26,42,0.6) !important; }
      button { background: #818cf8 !important; color: #0b0c14 !important; }
    }
    .card {
      max-width: 360px;
      width: 100%;
      text-align: center;
      background: rgba(255,255,255,0.7);
      border-radius: 24px;
      padding: 32px 24px;
    }
    h1 { font-size: 1.2rem; margin: 0 0 8px; }
    p { font-size: 0.95rem; opacity: 0.75; margin: 0 0 20px; }
    button {
      border: none;
      background: #4f46e5;
      color: #fff;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 0.95rem;
      min-height: 46px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Geen internetverbinding</h1>
    <p>Ringtools heeft een actieve verbinding nodig om je gegevens veilig te laden. Probeer het opnieuw zodra je weer online bent.</p>
    <button onclick="location.reload()">Opnieuw proberen</button>
  </div>
</body>
</html>
