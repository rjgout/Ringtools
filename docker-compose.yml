version: "3.8"

services:
  ringpresidium:
    build: .
    container_name: ringpresidium
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Pas deze waarden aan in Portainer (Stack -> Environment variables)
      APP_BASE_URL: "https://ringpresidium.jouwdomein.nl"
      SESSION_SECRET: "verander-dit-in-een-lange-willekeurige-tekst"
      COOKIE_SECURE: "true"
      ADMIN_USERNAME: "webmin"
      ADMIN_PASSWORD: "ldstools123!"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      MAIL_FROM: "Ringpresidium <noreply@jouwdomein.nl>"
      PORT: "3000"
    volumes:
      # Map naar een map op je NAS, zodat je de data terugvindt in File Station
      # en makkelijk kunt back-uppen. Pas "/volume1" aan als jouw NAS een ander
      # volume gebruikt (bv. /volume2).
      - /volume1/docker/ringpresidium/data:/app/data
