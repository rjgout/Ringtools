services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false" # PostgreSQL wordt nooit automatisch bijgewerkt (major-upgrades vragen een dump/restore)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ringtools}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ringtools}
    volumes:
      - ringtools_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ringtools} -d ${POSTGRES_DB:-ringtools}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    # Standaard: kant-en-klare image van GitHub Container Registry (gebouwd
    # door de GitHub Actions-workflow bij elke push naar main). Dit voorkomt
    # dat Portainer/Docker op de Synology zelf een multi-stage build moet
    # draaien, wat op sommige DSM/Container Manager-versies kan mislukken.
    # Wil je toch lokaal bouwen vanaf de broncode? Vervang de regel hieronder
    # door: build: .
    image: ghcr.io/rjgout/ringtools:latest
    restart: unless-stopped
    # Automatische updates (besluit eigenaar): Watchtower mag deze service bijwerken zodra er een nieuwe :latest op main is gepubliceerd.
    # Het label "enable=true" is nodig als Watchtower met WATCHTOWER_LABEL_ENABLE=true draait (alleen gelabelde containers) en is
    # onschadelijk in de standaardmodus (alles behalve "enable=false"). Zie docs/BACKUP-HERSTEL.md.
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ringtools}:${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ringtools}?schema=public
      APP_BASE_URL: ${APP_BASE_URL:?zet APP_BASE_URL}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-webmin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?zet BOOTSTRAP_ADMIN_PASSWORD}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?zet SETTINGS_ENCRYPTION_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Web Push (optioneel): leeg laten schakelt pushnotificaties uit zonder
      # de rest van de app te beïnvloeden. Zie README "Web Push".
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:beheer@ringapeldoorn.nl}
      # Native pushmeldingen (optioneel; leeg = uit). Zie docs/MOBILE.md.
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      APNS_KEY_P8: ${APNS_KEY_P8:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-true}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      APNS_KEY_P8_FILE: ${APNS_KEY_P8_FILE:-}
      # Universele links / app-links (optioneel; leeg = de .well-known-bestanden zijn leeg)
      APPLE_APP_ID: ${APPLE_APP_ID:-}
      ANDROID_SHA256_FINGERPRINTS: ${ANDROID_SHA256_FINGERPRINTS:-}
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-nl.ringapeldoorn.ringtools}
      PORT: 2809
    ports:
      - "2809:2809"

volumes:
  ringtools_db:
