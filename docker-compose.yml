services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ringtools}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ringtools}
    volumes:
      - ringtools_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ringtools} -d ${POSTGRES_DB:-ringtools}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    # Standaard: kant-en-klare image van GitHub Container Registry (gebouwd
    # door de GitHub Actions-workflow bij elke push naar main). Dit voorkomt
    # dat Portainer/Docker op de Synology zelf een multi-stage build moet
    # draaien, wat op sommige DSM/Container Manager-versies kan mislukken.
    # Wil je toch lokaal bouwen vanaf de broncode? Vervang de regel hieronder
    # door: build: .
    image: ghcr.io/rjgout/ringtools:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ringtools}:${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ringtools}?schema=public
      APP_BASE_URL: ${APP_BASE_URL:?zet APP_BASE_URL}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-webmin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?zet BOOTSTRAP_ADMIN_PASSWORD}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?zet SETTINGS_ENCRYPTION_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PORT: 2809
    ports:
      - "2809:2809"

volumes:
  ringtools_db:
